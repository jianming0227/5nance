<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5NANCE - Delete Account</title>
        <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/user.css">
    <link href="css/nav.css" rel="stylesheet">
    <style>
        .btn-delete {
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .btn-delete.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .input-container input.valid {
            border-color: #28a745;
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
        }
        
        .input-container input.invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
        }
    </style>
</head>
<body>
   <!-- Navbar -->
  <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <main>
        <h1 style="margin-top: 80px;">Delete Account</h1>

      <div class="delete-modal">
        <h2>Whoa, there!</h2>

        <p>
          Once you delete your account, there's no getting back.<br>
          Make sure you want to do this.
        </p>

        <div class="input-container">
          <input type="text" id="deleteConfirmInput" class="form-input" placeholder="Confirm by typing DELETE" required>
        </div>

        <div class="button-group">
            <a href="#" id="cancelButton" class="btn-cancel" type="button">CANCEL</a>
            <a href="#" id="deleteButton" class="btn-delete" type="button">YEP, DELETE IT</a>
        </div>

      </div>
    </main>
  </div>

  <script>
    // Get the "from" query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const fromPage = urlParams.get('from');

    // Get the cancel button element
    const cancelButton = document.getElementById('cancelButton');

    // Set the appropriate href
    if (fromPage === 'edit-profile') {
      cancelButton.href = 'edit-profile.html';
    } else {
      // default to view-profile if not specified or unknown
      cancelButton.href = 'view-profile.html';
    }

    // Add validation for delete confirmation
    const deleteConfirmInput = document.getElementById('deleteConfirmInput');
    const deleteButton = document.getElementById('deleteButton');

    deleteConfirmInput.addEventListener('input', function() {
        const inputValue = this.value.trim();
        const isValid = inputValue === 'DELETE';
        
        // Update input styling
        this.classList.remove('valid', 'invalid');
        if (inputValue === '') {
            // No styling when empty
        } else if (isValid) {
            this.classList.add('valid');
        } else {
            this.classList.add('invalid');
        }
        
        // Update button state
        if (isValid) {
            deleteButton.classList.add('active');
        } else {
            deleteButton.classList.remove('active');
        }
    });

    // Add delete account functionality
    deleteButton.addEventListener('click', async function(e) {
      e.preventDefault();
      
      // Double-check validation
      const inputValue = deleteConfirmInput.value.trim();
      if (inputValue !== 'DELETE') {
        alert('Please type "DELETE" exactly to confirm account deletion.');
        return;
      }
      
      const userId = localStorage.getItem('userId');
      if (!userId) {
        alert('User ID not found. Please log in again.');
        return;
      }
      
      // Final confirmation
      const finalConfirm = confirm('Are you absolutely sure you want to delete your account? This action cannot be undone.');
      if (!finalConfirm) {
        return;
      }
      
      try {
        const response = await fetch(`/api/user/${userId}`, {
          method: 'DELETE',
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.removeItem('userId');
          window.location.href = data.redirect;
        } else {
          alert(data.message || 'Failed to delete account.');
        }
      } catch (error) {
        console.error('Error deleting account:', error);
        alert('An error occurred while deleting your account.');
      }
    });
  </script>
  <script src="js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
<!-- Footer -->
<footer class="text-center py-3 text-white" style="background-color: #010725;">
  &copy; copyright 5nance <span id="year"></span>
</footer>
</html>
