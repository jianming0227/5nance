<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>5nance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/home.css" rel="stylesheet">
    <link href="css/user.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/nav.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body style="background-color: #010725; color: white; font-family: 'DM Sans', 'Inter', sans-serif;">

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>
    <script src="js/navbar.js"></script>

    <!-- Main Content -->
    <main>
        <h1 class="welcome" style="margin-top: 80px;">Welcome Back!</h1>
        <div class="login-box">
            <h2>Enter your Credentials to access your account</h2>
            <form onsubmit="return login();">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="email@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Password" id="myInput" required>
                </div>

                <div class="checkbox-row">
                    <label class="checkbox">
                        <input type="checkbox" id="showpassword" onclick="pwVisibility()">
                        Show Password
                    </label>

                    <label class="checkbox">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>
                </div>

                <div class="form-group">
                    <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                </div>

                <div class="button-group">
                    <a href="index.html" class="cancel">CANCEL</a>
                    <button type="submit" class="login-button login">LOG IN</button>
                </div>

                <a href="/auth/google" style="text-decoration: none;">
                    <button class="google-signin" style="display: flex; align-items: center; gap: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                            class="google-icon">
                            <path fill="#EA4335" d="M5.26620003,9.76452941 ... Z" />
                            <!-- You can keep the rest of your paths -->
                        </svg>
                        <span style="font-weight: 500;">Sign in with Google</span>
                    </button>
                </a>
                </a>

                <div class="form-group">
                    <p class="signup-text" style="margin-top: 16px;">
                        Don’t have an account? <a href="sign-up-page.html" class="signup-link">Sign Up</a>
                    </p>
                </div>
            </form>
        </div>
    </main>
    </div>

    <script src="js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <div id="toast" class="toast">Message</div>

</body>
<footer class="text-center py-3 text-white" style="background-color: #010725;">
    &copy; copyright 5nance <span id="year"></span>
</footer>

</html>
